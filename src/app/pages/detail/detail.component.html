<div>
  <p>{{ countryName$ | async }}</p>
  <div>
    <p>Numbers of Entries</p>
    <p>{{ numberOfJos$ | async }}</p>
    <p>Total number medals</p>
    <p>{{ medalsCount$ | async }}</p>
    <p>Total number of athletes</p>
    <p>{{ athletesCount$ | async }}</p>
  </div>
  <div>
    @if (chartData$ | async; as data) {
    <app-line-chart [results]="data" />
    } @else {
    <p>No data available</p>
    }
    <button (click)="goBack()">Go back</button>
  </div>
</div>
