@if (results && results.length > 0) {
<div class="chart-container">
  <ngx-charts-pie-chart
    [results]="results"
    [gradient]="true"
    [labels]="true"
    [doughnut]="false"
    [trimLabels]="false"
    [tooltipDisabled]="false"
    [tooltipText]="getTooltipText"
    (select)="onChartSelect($event)"
  />
</div>

} @else {
<p>No data available</p>
}
